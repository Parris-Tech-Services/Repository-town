name: Paul Roe Memorial Regression
on:
  push:
    branches:
      - main
      - fix/paul-roe-memorial-rooms-20261020
    paths:
      - 'world/paul-roe-tribute.js'
      - 'world/interior.js'
      - 'world/props.js'
      - 'main.js'
      - 'houses.json'
      - 'tests/paul-roe-memorial.mjs'
      - '.github/workflows/paul-roe-memorial.yml'
  pull_request:
    paths:
      - 'world/paul-roe-tribute.js'
      - 'world/interior.js'
      - 'world/props.js'
      - 'main.js'
      - 'houses.json'
      - 'tests/paul-roe-memorial.mjs'
      - '.github/workflows/paul-roe-memorial.yml'
  workflow_dispatch:
jobs:
  tribute-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check public memorial content, links, labels and privacy
        run: node tests/paul-roe-memorial.mjs
