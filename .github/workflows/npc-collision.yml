name: NPC Collision and Passing
on:
  push:
    branches:
      - main
      - fix/publish-reconciled-shop-crowd-20261020
    paths:
      - 'main.js'
      - 'world/life.js'
      - 'world/pedestrian-spacing.js'
      - 'world/pedestrian-navigation.js'
      - 'world/npcs.js'
      - 'world/townlife.js'
      - 'tests/pedestrian-spacing.mjs'
      - 'tests/shop-crowd.mjs'
      - 'tests/pedestrian-navigation.mjs'
      - '.github/workflows/npc-collision.yml'
  pull_request:
    paths:
      - 'main.js'
      - 'world/life.js'
      - 'world/pedestrian-spacing.js'
      - 'world/pedestrian-navigation.js'
      - 'world/npcs.js'
      - 'world/townlife.js'
      - 'tests/pedestrian-spacing.mjs'
      - 'tests/shop-crowd.mjs'
      - 'tests/pedestrian-navigation.mjs'
      - '.github/workflows/npc-collision.yml'
jobs:
  collisions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate movement and steering JavaScript
        run: |
          node --check main.js
          node --check world/life.js
          node --check world/pedestrian-spacing.js
          node --check world/pedestrian-navigation.js
          node --check world/townlife.js
          node --check world/npcs.js
      - name: Run realistic mixed-crowd and passing regressions
        run: node tests/pedestrian-spacing.mjs && node tests/pedestrian-navigation.mjs && node tests/shop-crowd.mjs
      - name: Preserve the existing town's economy regressions
        run: node tests/economy.mjs && node tests/economy-realism.mjs
