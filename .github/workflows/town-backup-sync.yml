name: Mirror verified Repository Town main to GitHub Pages
# This independent release gate also verifies expanded public hours and safe staffing
# so the returns-cage choice cannot silently leave an unchanged modal open.
# Budget-controlled one-off recovery: push triggers only when this workflow file itself changes.
# Regular changes in either repository still do NOT auto-trigger a full rebuild.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/town-backup-sync.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: town-production-backup
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: site
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: joshualparris/JoshMemory
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: source
      - name: Pin latest canonical main for independent verification
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git -C source rev-parse HEAD)
          previous=$(node -p "require('./site/release.json').sourceCommit")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$sha" == "$previous" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages already mirrors verified source $sha"
            exit 0
          fi
          # Build, five simulation seeds and recorded desktop/mobile WebGL tests
          # run in this job against this exact SHA. Do not depend on Vercel or
          # upstream workflow completion, which can lag concurrent PR merges.
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Publishing verified JoshMemory source $sha"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.verified.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/repository-town/package-lock.json
      - name: Build full public release from pinned source
        if: steps.verified.outputs.changed == 'true'
        working-directory: source/repository-town
        env:
          TOWN_SOURCE_COMMIT: ${{ steps.verified.outputs.sha }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:release
          for seed in 1 42 20261019 20261021 8675309; do
            node tests/simulation-soak.mjs --days 28 --seed "$seed" --quiet > "/tmp/town-seed-$seed.log" || { cat "/tmp/town-seed-$seed.log"; exit 1; }
            grep '38 passed, 0 findings' "/tmp/town-seed-$seed.log"
          done
      - name: Install headless Chromium for independent GitHub Pages release verification
        if: steps.verified.outputs.changed == 'true'
        working-directory: source/repository-town
        run: npx playwright install --with-deps chromium
      - name: Playtest the exact public build in desktop and Android-size Chromium
        if: steps.verified.outputs.changed == 'true'
        working-directory: source/repository-town
        env:
          TOWN_PLAYTEST_URL: http://127.0.0.1:8091/
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          node tools/serve.mjs dist/public 8091 > /tmp/pages-town-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8091/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsSI http://127.0.0.1:8091/ >/dev/null
          node tests/webgl-playtest.mjs
          TOWN_URL=http://127.0.0.1:8091/ node tests/pub-id-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.verified.outputs.changed == 'true'
        with:
          name: verified-pages-webgl-${{ github.run_id }}
          path: source/repository-town/test-results/webgl-playtest/
          retention-days: 14
          if-no-files-found: ignore
      - name: Verify release fingerprint and prepare GitHub Pages backup
        if: steps.verified.outputs.changed == 'true'
        env:
          EXPECTED_SOURCE_COMMIT: ${{ steps.verified.outputs.sha }}
        run: |
          set -euo pipefail
          export EXPECTED_CONTENT_HASH=$(node -p "require('./source/repository-town/dist/public/release.json').contentHash")
          test -n "$EXPECTED_CONTENT_HASH"
          node source/repository-town/tools/sync-backup.mjs site
          test "$(node -p "require('./site/release.json').sourceCommit")" = "$EXPECTED_SOURCE_COMMIT"
      - name: Publish only if pinned commit is still main
        if: steps.verified.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.verified.outputs.sha }}
        run: |
          set -euo pipefail
          # Release may be a verified ancestor if another merge lands during
          # the long build. Never deploy a commit outside canonical main.
          current=$(gh api repos/joshualparris/JoshMemory/commits/main --jq .sha)
          if [[ "$current" != "$RELEASE_SHA" ]]; then
            relation=$(gh api "repos/joshualparris/JoshMemory/compare/$RELEASE_SHA...main" --jq '.status')
            if [[ "$relation" != "ahead" && "$relation" != "identical" ]]; then
              echo "::error::Source $RELEASE_SHA is no longer in canonical main"
              exit 1
            fi
            echo "::notice::Main advanced to $current; publishing last fully verified ancestor $RELEASE_SHA"
          fi
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add -A
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "Mirror verified Town main $RELEASE_SHA"
            git -C site push origin HEAD:main
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
