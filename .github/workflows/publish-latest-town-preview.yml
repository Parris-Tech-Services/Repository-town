name: Verified latest Repository Town preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-latest-town-preview.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: repo-town-latest-preview
  cancel-in-progress: false
jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
      - uses: actions/checkout@v4
        with:
          repository: joshualparris/JoshMemory
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: source
      - name: Pin source
        id: source
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/repository-town/package-lock.json
      - name: Build and verify public release
        working-directory: source/repository-town
        env:
          TOWN_SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:release
          node -e 'const r=require("./dist/public/release.json");if(r.sourceCommit!==process.env.TOWN_SOURCE_COMMIT)throw Error("Wrong release commit");if(!/^[a-f0-9]{64}$/.test(r.contentHash))throw Error("Missing release fingerprint")'
      - name: Install Chromium
        working-directory: source/repository-town
        run: npx playwright install --with-deps chromium
      - name: Playtest real desktop and mobile WebGL
        working-directory: source/repository-town
        env:
          TOWN_URL: http://127.0.0.1:8091/
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          node tools/serve.mjs dist/public 8091 > /tmp/site.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8091/ > /dev/null && break
            sleep 1
          done
          node tests/town-rail-yard-browser.mjs
          node tests/narromine-post-office-browser.mjs
          node tests/narromine-north-dandaloo-browser.mjs
      - name: Generate and validate HUD-clean Narromine photo-comparison workspace
        working-directory: source/repository-town
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { runNarrominePhotoCompare } from './tools/narromine-visual-qa/photo-compare/run-photo-compare.mjs';
          // Host in /Repository-town/latest/photo-compare: relative game path
          // keeps the live iframe and saved game on the SAME Pages origin.
          // No Google API key is injected; the viewer explicitly asks its user.
          const result = await runNarrominePhotoCompare({
            outDir: 'test-results/narromine-photo-compare',
            liveGameUrl: '../index.html',
            sampleFrames: 6,
            embedLocalReferences: true,
          });
          const summary = result.manifest.summary;
          if (!summary.passed || summary.passedCaptures !== 48 || summary.totalCaptures !== 48)
            throw new Error('Comparison captures incomplete: ' + JSON.stringify(summary));
          const html = fs.readFileSync(result.reportPath, 'utf8');
          if (/AIza[0-9A-Za-z_-]{35}/.test(html)) throw new Error('Refusing to publish embedded Google API key');
          if (!html.includes('../index.html')) throw new Error('Game iframe must use same-origin Pages preview');
          console.log('PASS hosted photo comparison: 48 HUD-clean game screenshots, exact game-relative path, no embedded API key');
          NODE
          node tests/narromine-visual-qa/photo-compare/photo-compare.mjs
          test -s test-results/narromine-photo-compare/report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-town-browser-${{ github.run_id }}
          path: source/repository-town/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Publish to Pages subfolder only (leave stable root untouched)
        env:
          EXPECTED: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p 'require("./source/repository-town/dist/public/release.json").sourceCommit')" = "$EXPECTED"
          mkdir -p site/latest
          find site/latest -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a source/repository-town/dist/public/. site/latest/
          # Only locally generated game frames and explicitly licensed aerial references
          # are included. Do not scrape, screenshot or store Google Street View pixels.
          # Publish only the intended static HTML and game-rendered PNGs, not
          # scratch screenshots, source-machine paths or raw audit data.
          mkdir -p site/latest/photo-compare/screenshots
          cp source/repository-town/test-results/narromine-photo-compare/report.html site/latest/photo-compare/
          cp source/repository-town/test-results/narromine-photo-compare/index.html site/latest/photo-compare/
          cp source/repository-town/test-results/narromine-photo-compare/screenshots/*.png site/latest/photo-compare/screenshots/
          test -s site/latest/photo-compare/report.html
          test -s site/latest/photo-compare/index.html
          test "$(find site/latest/photo-compare/screenshots -name '*.png' | wc -l)" -eq 48
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add -A latest
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "Tested Town latest preview $EXPECTED"
            git -C site fetch --depth=50 origin main
            git -C site rebase FETCH_HEAD
            git -C site push origin HEAD:main
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
      - name: Verify live preview commit
        env:
          EXPECTED: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsSL "https://parris-tech-services.github.io/Repository-town/latest/release.json?run=$GITHUB_RUN_ID" -o /tmp/live-release.json; then
              test "$(node -p 'require("/tmp/live-release.json").sourceCommit')" = "$EXPECTED" && exit 0
            fi
            sleep 10
          done
          exit 1
