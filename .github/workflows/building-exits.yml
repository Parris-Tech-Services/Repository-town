name: Building Exit Regression
on:
  push:
    branches:
      - main
      - fix/exit-facing-away-2026-10-20
    paths:
      - 'world/shop-exit.js'
      - 'main.js'
      - 'tests/building-exits.mjs'
      - '.github/workflows/building-exits.yml'
  pull_request:
    paths:
      - 'world/shop-exit.js'
      - 'main.js'
      - 'tests/building-exits.mjs'
      - '.github/workflows/building-exits.yml'
jobs:
  building-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and safe outward-facing exits
        run: |
          node --check world/shop-exit.js
          node --check main.js
          node tests/building-exits.mjs
